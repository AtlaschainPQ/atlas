[package]
name    = "atlas-wallet-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ATLAS Web-Wallet — Baby-Jubjub-EdDSA-Signing (L2) als WASM"

# Eigener Workspace-Root: isoliert die Feature-Auflösung vom Haupt-Workspace,
# damit atlas-zk hier OHNE native-perf (asm/rayon) für wasm32 gebaut wird.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# atlas-zk OHNE native-perf → kein x86-asm, kein rayon → wasm32-tauglich.
atlas-zk     = { path = "../crates/atlas-zk", default-features = false }
wasm-bindgen = "0.2"
serde_json   = "1"
hex          = "0.4"
getrandom    = { version = "0.2", features = ["js"] }
bip39        = { version = "2", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"   # kleines WASM-Binary
lto       = true
